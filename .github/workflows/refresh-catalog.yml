name: Refresh product catalog

# Reads the stores' open product feeds once a day and commits the new catalog.
# A commit to main deploys the site, so the prototype shows today's prices.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - name: Commit the new catalog
        run: |
          if git diff --quiet -- public/data; then
            echo "No change in the feeds."
            exit 0
          fi
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh the product catalog from the store feeds"
          git push
